<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أقسام PS4 - Modded Games Store</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg-dark: #0a0b10;
            --card-bg: rgba(30, 32, 50, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #1a1c2e 0%, var(--bg-dark) 70%);
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 28px;
            color: #fff;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 20px 40px rgba(0, 255, 204, 0.08);
        }

        .image-wrapper {
            background: rgba(0,0,0,0.2);
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card-title {
            font-size: 24px;
            margin: 0 0 20px 0;
        }

        .btn-link {
            display: block;
            background: linear-gradient(90deg, var(--primary), #00b3ff);
            color: #000;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-link:hover {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
        }

        .btn-back {
            display: inline-block;
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .center-wrapper {
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h1>Modded Games Store</h1>
        </div>
    </header>

    <div class="container">
        <h2 class="page-title">اختر القسم الفرعي</h2>
        
        <div class="cards-grid">
            <div class="card">
                <div class="image-wrapper">
                    <img src="images/goldhen.png" alt="GoldHen" class="card-image">
                </div>
                <div class="card-content">
                    <h3 class="card-title">GoldHen</h3>
                    <a href="goldhen.html" class="btn-link">استعراض الأدوات</a>
                </div>
            </div>

            <div class="card">
                <div class="image-wrapper">
                    <img src="images/games.png" alt="Games" class="card-image">
                </div>
                <div class="card-content">
                    <h3 class="card-title">Games</h3>
                    <a href="games.html" class="btn-link">استعراض الألعاب</a>
                </div>
            </div>
        </div>

        <div class="center-wrapper">
            <a href="index.html" class="btn-back">رجوع للرئيسية</a>
        </div>
    </div>

</body>
</html>
