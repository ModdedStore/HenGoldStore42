<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Modded Games Store</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff0055;
            --bg-dark: #0a0b10;
            --card-bg: rgba(30, 32, 50, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #1a1c2e 0%, var(--bg-dark) 70%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* نافبار عائم وثابت يحتوي على شعار المتجر */
        header {
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 60px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 40px;
        }

        /* شبكة عرض الألعاب */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* بطاقة اللعبة المستوحاة من المتاجر العالمية */
        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.08);
        }

        /* غلاف أو بوستر اللعبة */
        .game-poster-wrapper {
            width: 100%;
            height: 300px;
            background-color: rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-poster {
            width: 100%;
            height: 100%;
            object-fit: cover; /* البوسترات تظهر بشكل كامل كالأغلفة الأصيلة */
            transition: transform 0.4s ease;
        }

        .game-card:hover .game-poster {
            transform: scale(1.05);
        }

        /* تفاصيل اللعبة داخل البطاقة */
        .game-details {
            padding: 20px;
            text-align: center;
        }

        .game-name {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-meta {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            color: #888da8;
            margin-bottom: 15px;
        }

        .game-size {
            color: var(--primary);
        }

        /* زر تحميل نيون مخصص للألعاب */
        .btn-game-download {
            display: block;
            background: linear-gradient(90deg, var(--primary), #00b3ff);
            color: #000;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.15);
        }

        .btn-game-download:hover {
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        /* زر الرجوع للخلف في الأسفل */
        .btn-back {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: var(--secondary);
            border-color: var(--secondary);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .center-wrapper {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- الهيدر الموحد الفخم -->
    <header>
        <div class="brand">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h1>Modded Games Store</h1>
        </div>
    </header>

    <div class="container">
        <h2 class="page-title">مكتبة ألعاب PS4 المعدلة</h2>
        
        <!-- شبكة الألعاب -->
        <div class="games-grid">
            
            <!-- اللعبة الأولى (مثال جاهز) -->
            <div class="game-card">
                <div class="game-poster-wrapper">
                    <!-- ضع بوستر اللعبة داخل مجلد images وسمه game1.png مثلاً أو ضع رابطاً مباشراً -->
                    <img src="images/games.png" alt="Game Poster" class="game-poster">
                </div>
                <div class="game-details">
                    <h3 class="game-name">اسم اللعبة الأولى</h3>
                    <div class="game-meta">
                        <span class="game-size">45 GB</span>
                        <span class="game-ver">CUSAXXXXX</span>
                    </div>
                    <!-- يمكنك وضع رابط تحميل اللعبة مكان علامة # -->
                    <a href="#" class="btn-game-download">تحميل اللعبة</a>
                </div>
            </div>

            <!-- اللعبة الثانية (تكرار الكود بسهولة لزيادة الألعاب) -->
            <div class="game-card">
                <div class="game-poster-wrapper">
                    <img src="images/games.png" alt="Game Poster" class="game-poster">
                </div>
                <div class="game-details">
                    <h3 class="game-name">اسم اللعبة الثانية</h3>
                    <div class="game-meta">
                        <span class="game-size">32 GB</span>
                        <span class="game-ver">CUSAXXXXX</span>
                    </div>
                    <a href="#" class="btn-game-download">تحميل اللعبة</a>
                </div>
            </div>

            <!-- اللعبة الثالثة -->
            <div class="game-card">
                <div class="game-poster-wrapper">
                    <img src="images/games.png" alt="Game Poster" class="game-poster">
                </div>
                <div class="game-details">
                    <h3 class="game-name">اسم اللعبة الثالثة</h3>
                    <div class="game-meta">
                        <span class="game-size">50 GB</span>
                        <span class="game-ver">CUSAXXXXX</span>
                    </div>
                    <a href="#" class="btn-game-download">تحميل اللعبة</a>
                </div>
            </div>

        </div>

        <!-- زر العودة لصفحة أقسام الـ PS4 -->
        <div class="center-wrapper">
            <a href="ps4-section.html" class="btn-back">رجوع للخلف</a>
        </div>

    </div>

</body>
</html>
