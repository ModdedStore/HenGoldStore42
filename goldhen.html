<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldHen - Modded Games Store</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff0055;
            --bg-dark: #0a0b10;
            --card-bg: rgba(30, 32, 50, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #1a1c2e 0%, var(--bg-dark) 70%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* نافبار المتجر الثابت */
        header {
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px 60px 20px;
        }

        /* قسم العرض الرئيسي للبوستر والشرح */
        .hero-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            margin-bottom: 35px;
        }

        .page-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            margin-bottom: 25px;
        }

        h2 {
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #fff;
        }

        .description {
            color: #b3b8d4;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* حاوية زر التعديل عبر المتصفح المدمج */
        .exploit-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            border: 1px dashed rgba(0, 255, 204, 0.2);
            margin-top: 20px;
        }

        /* زر النيون الكبير الفخم للتعديل */
        .btn-exploit {
            display: inline-block;
            background: linear-gradient(90deg, var(--primary), #00b3ff);
            color: #000;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.2);
        }

        .btn-exploit:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        /* زر الرجوع للخلف */
        .btn-back {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: var(--secondary);
            border-color: var(--secondary);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .center-wrapper {
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h1>Modded Games Store</h1>
        </div>
    </header>

    <div class="container">
        
        <!-- القسم الرئيسي مع زر التعديل المباشر المربوط بالفولدر وبدون الأقسام الممسوحة -->
        <div class="hero-section">
            <img src="images/goldhen.png" alt="GoldHen" class="page-image">
            <h2>GoldHen Homebrew</h2>
            <p class="description">
                مرحباً بك في القسم المخصص لأداة التعديل الأقوى والأكثر استقراراً لأجهزة بلايستيشن 4 المعدلة.
            </p>
            
            <div class="exploit-container">
                <a href="Jailbreak/index.html" class="btn-exploit">تعديل عبر المتصفح</a>
            </div>
        </div>

        <!-- زر العودة لصفحة أقسام الـ PS4 -->
        <div class="center-wrapper">
            <a href="ps4-section.html" class="btn-back">رجوع للخلف</a>
        </div>

    </div>

</body>
</html>
