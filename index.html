<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modded Games Store</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff0055;
            --bg-dark: #0a0b10;
            --card-bg: rgba(30, 32, 50, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #1a1c2e 0%, var(--bg-dark) 70%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* نافبار عصري عائم */
        header {
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--primary), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* شبكة بطاقات احترافية ثلاثية الأبعاد */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 20px 40px rgba(0, 255, 204, 0.08);
        }

        .image-wrapper {
            background: rgba(0,0,0,0.2);
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.4s;
        }

        .card:hover .card-image {
            transform: scale(1.08);
        }

        .card-content {
            padding: 25px;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        .card-title {
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            font-weight: 600;
        }

        /* زر نيون فخم */
        .btn-link {
            display: block;
            background: linear-gradient(90deg, var(--primary), #00b3ff);
            color: #000;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }

        .btn-link:hover {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            transform: translateY(-2px);
        }

        /* بطاقة قريباً بنظام الوميض */
        .card.soon:hover {
            border-color: rgba(255, 0, 85, 0.3);
            box-shadow: 0 20px 40px rgba(255, 0, 85, 0.08);
        }

        .coming-soon {
            color: var(--secondary);
            font-weight: 700;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
            margin: 15px 0;
        }

        @keyframes pulse {
            0% { opacity: 0.6; filter: drop-shadow(0 0 2px var(--secondary)); }
            50% { opacity: 1; filter: drop-shadow(0 0 10px var(--secondary)); }
            100% { opacity: 0.6; filter: drop-shadow(0 0 2px var(--secondary)); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h1>Modded Games Store</h1>
        </div>
    </header>

    <div class="container">
        <div class="cards-grid">
            
            <div class="card">
                <div class="image-wrapper">
                    <img src="images/PS4.png" alt="PS4" class="card-image">
                </div>
                <div class="card-content">
                    <h2 class="card-title">PS4</h2>
                    <p class="card-subtitle">Jailbreak / جيليبريك</p>
                    <a href="ps4-section.html" class="btn-link">دخول القسم</a>
                </div>
            </div>

            <div class="card soon">
                <div class="image-wrapper">
                    <img src="images/PS5.png" alt="PS5" class="card-image">
                </div>
                <div class="card-content">
                    <h2 class="card-title">PS5</h2>
                    <p class="coming-soon">COMING SOON / قريباً</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
